# Publishes the library modules (core, database-api, sqlite, filesystem,
# history, reactive, room, testing) to Maven Central via the Central Portal,
# then releases the deployment automatically.
#
# Triggered by pushing a version tag:    v1.2.3  ->  version 1.2.3
# Can also be started manually (workflow_dispatch) with an explicit version
# input (without the v prefix).
#
# Required repository secrets (see docs/RELEASE.md for how to create them):
#   MAVEN_CENTRAL_USERNAME   Central Portal user token "username"
#   MAVEN_CENTRAL_PASSWORD   Central Portal user token "password"
#   GPG_PRIVATE_KEY          ASCII-armored private key (gpg --export-secret-keys --armor <id>)
#   GPG_KEY_ID               (optional) signing key id; a full fingerprint is
#                            reduced to its last 8 hex chars, unusable values
#                            are dropped so Gradle derives the id itself
#   GPG_PASSPHRASE           (optional) passphrase of the signing key
name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish library modules
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Derive release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "publishVersion=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $V"

      # Fails here with a readable message instead of a Central Portal 401 or a
      # "cannot find signing key" stack trace later in the run.
      - name: Check publishing secrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          missing=""
          [ -z "$MAVEN_CENTRAL_USERNAME" ] && missing="$missing MAVEN_CENTRAL_USERNAME"
          [ -z "$MAVEN_CENTRAL_PASSWORD" ] && missing="$missing MAVEN_CENTRAL_PASSWORD"
          [ -z "$GPG_PRIVATE_KEY" ] && missing="$missing GPG_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:${missing}"
            exit 1
          fi
          echo "All required publishing secrets are present."

      # Gradle accepts only the 8-hex short key id ("0x567B0D87"): a full
      # fingerprint, a 16-hex long id and an empty value all fail task
      # configuration. Anything unusable is dropped so Gradle derives the id
      # from the private key itself.
      - name: Resolve signing key id
        id: keyid
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        shell: bash
        run: |
          id="${GPG_KEY_ID//[[:space:]]/}"
          id="${id#0[Xx]}"
          case "$id" in
            *[!0-9A-Fa-f]*) id="" ;;
          esac
          if [ "${#id}" -gt 8 ]; then id="${id: -8}"; fi
          if [ -z "$id" ]; then
            echo "::warning::GPG_KEY_ID is not a hex key id; deriving it from the private key instead."
          fi
          echo "value=$id" >> "$GITHUB_OUTPUT"
          echo "Signing key id: ${id:-<derived from private key>}"

      - name: Publish and release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          # make publishToMavenCentral also release the validated deployment
          ORG_GRADLE_PROJECT_mavenCentralAutomaticPublishing: "true"
          SIGNING_KEY_ID: ${{ steps.keyid.outputs.value }}
          PUBLISH_VERSION: ${{ steps.version.outputs.publishVersion }}
        shell: bash
        run: |
          # Actions runs this with -e; the pipeline must survive a Gradle failure
          # long enough to report it.
          set +e
          args=(publishToMavenCentral "-PpublishVersion=$PUBLISH_VERSION" --no-daemon --stacktrace)
          if [ -n "$SIGNING_KEY_ID" ]; then
            args+=("-PsigningInMemoryKeyId=$SIGNING_KEY_ID")
          fi
          ./gradlew "${args[@]}" 2>&1 | tee /tmp/gradle-publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Job logs are admin-only, so the parts that explain the failure are
            # promoted to annotations. Secret values are masked by Actions.
            awk '/^\* What went wrong:/{p=1} /^\* Try:/{p=0} p' /tmp/gradle-publish.log \
              | sed 's/^/::error:: /'
            grep -Ei 'maven central|portal|signing|gpg|status code|unauthoris|forbidden|namespace' \
              /tmp/gradle-publish.log | tail -12 | sed 's/^/::error:: /'
            exit "$status"
          fi
