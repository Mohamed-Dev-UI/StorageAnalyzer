# Publishes the library modules (core, database-api, sqlite, filesystem,
# history, reactive, room, testing) to Maven Central via the Central Portal,
# then releases the deployment automatically.
#
# Triggered by pushing a version tag:    v1.2.3  ->  version 1.2.3
# Can also be started manually (workflow_dispatch) with an explicit version
# input (without the v prefix).
#
# Required repository secrets (see docs/RELEASE.md for how to create them):
#   MAVEN_CENTRAL_USERNAME   Central Portal user token "username"
#   MAVEN_CENTRAL_PASSWORD   Central Portal user token "password"
#   GPG_PRIVATE_KEY          ASCII-armored private key (gpg --export-secret-keys --armor <id>)
#   GPG_KEY_ID               (optional) short key id of the signing key
#   GPG_PASSPHRASE           (optional) passphrase of the signing key
name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish library modules
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Derive release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "publishVersion=$V" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $V"

      - name: Publish and release to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
          # make publishToMavenCentral also release the validated deployment
          ORG_GRADLE_PROJECT_mavenCentralAutomaticPublishing: "true"
        run: >
          ./gradlew publishToMavenCentral
          -PpublishVersion=${{ steps.version.outputs.publishVersion }}
          --no-daemon
          --stacktrace
